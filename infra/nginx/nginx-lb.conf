# ──────────────────────────────────────────────────────────────────────────────
# Prompt Polisher — Production Nginx Load Balancer Configuration
# nginx-lb.conf (Laptop 1)
#
# Task: Week 9-10 / Multi-Node Deployment
#   [x] least_conn for REST API
#   [x] ip_hash for WebSocket connections
#   [x] Health checks (passive)
#   [x] WebSocket sticky sessions
#
# Replace NODE_A_IP and NODE_B_IP with actual static IPs.
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream: REST API (least_conn load balancing) ────────────────────────
    # Distributes traffic to the backend with the fewest active connections.
    upstream backend_rest {
        least_conn;

        server 192.168.1.102:8000 max_fails=3 fail_timeout=30s;  # Node A (Laptop 2)
        server 192.168.1.103:8000 max_fails=3 fail_timeout=30s;  # Node B (Laptop 3)
    }

    # ── Upstream: WebSocket (ip_hash sticky sessions) ────────────────────────
    # Ensures a client always connects to the same backend for WebSocket state.
    upstream backend_ws {
        ip_hash;

        server 192.168.1.102:8000;  # Node A (Laptop 2)
        server 192.168.1.103:8000;  # Node B (Laptop 3)
    }

    # ── Upstream: Frontend ────────────────────────────────────────────────────
    upstream frontend_app {
        server 192.168.1.102:3000;  # Frontend on Node A (or wherever it runs)
    }

    # ── Health Check Endpoint (for LB itself) ─────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /health {
            return 200 '{"status":"ok","service":"nginx-lb"}';
            add_header Content-Type application/json;
        }

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server (Main) ───────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # SSL certificates
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options       "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection      "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── API Routes → Backend REST (least_conn) ───────────────────────────
        location /api/ {
            proxy_pass         http://backend_rest;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            # Passive health check: if a node fails 3 times in 30s, skip it
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # ── Swagger Docs → Backend ───────────────────────────────────────────
        location /docs {
            proxy_pass         http://backend_rest;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass         http://backend_rest;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /openapi.json {
            proxy_pass         http://backend_rest;
            proxy_set_header   Host $host;
        }

        # ── WebSocket → Backend WS (ip_hash sticky) ─────────────────────────
        location /ws/ {
            proxy_pass         http://backend_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Frontend → Next.js ───────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Next.js HMR WebSocket (dev only) ─────────────────────────────────
        location /_next/webpack-hmr {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── Nginx Status (for Prometheus nginx-exporter) ─────────────────────
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 192.168.1.0/24;
            deny all;
        }
    }
}
